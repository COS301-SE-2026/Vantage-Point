[mypy]
python_version = 3.12
plugins = pydantic.mypy
warn_unused_configs = True
ignore_missing_imports = True
warn_return_any = False
# app/api/routes.py is excluded because it is not mounted in main.py and imports
# app.schemas.profile_schemas, which does not exist yet, so it cannot be imported at
# all. It also calls ProfileService.build_player_summary/update_profile and a
# create_profile overload that are still unwritten. Drop it from this list once the
# module lands and the router is included, so the file is type checked again.
exclude = ^(\.venv|venv)/|^app/api/routes\.py$

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-mypy_boto3_cognito_idp.*]
ignore_missing_imports = False

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-bcrypt.*]
ignore_missing_imports = true
