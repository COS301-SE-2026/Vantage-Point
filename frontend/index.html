<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Vantage Point</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Mirrors the device theme onto <html> so the token-driven `dark:` variant
      (shadcn popovers, dialogs) matches the `device-dark:` surfaces. Inline and
      before the bundle so the class is set on first paint. A listener added
      after hydration would flash a light popover shell.
    -->
    <script>
      (function () {
        var query = window.matchMedia("(prefers-color-scheme: dark)");
        function apply(matches) {
          document.documentElement.classList.toggle("dark", matches);
          document.documentElement.style.colorScheme = matches
            ? "dark"
            : "light";
        }
        apply(query.matches);
        query.addEventListener("change", function (e) {
          apply(e.matches);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
