name: Deploy Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (Trigger)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Create Deployment Archive
        run: |
          # Package all repository files into a compressed tarball
          tar -czf release.tar.gz --exclude='.git' --exclude='release.tar.gz' .

      - name: Send Package to Webhook
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "X-Deploy-Token: ${{ secrets.WEBHOOK_TOKEN }}" \
            --data-binary "@release.tar.gz" \
            "${{ secrets.WEBHOOK_URL }}")

          if [ "$RESPONSE" -eq 200 ]; then
            echo "Successfully uploaded build payload and triggered deployment."
          else
            echo "Deployment webhook failed with HTTP status: $RESPONSE"
            exit 1
          fi
